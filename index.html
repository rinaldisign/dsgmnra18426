    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:

    .background-glow {

      z-index: 0;
    }

    .glow {

      filter: blur(120px);
      opacity: 0.25;
      animation: pulse 10s ease-in-out infinite;
    }

    .glow.one {
      width: 500px;
      height: 500px;
      background: #ff7eb6;
      top: -120px;
      left: 50%;

      right: -100px;
